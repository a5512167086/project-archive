apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: easybot
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  tls:
    - hosts:
        - easybot.wke.csie.ncnu.edu.tw
      secretName: wke-tls
  rules:
    - host: easybot.wke.csie.ncnu.edu.tw
      http:
        paths:
          - path: /userapi(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: user-service
                port:
                  number: 80
          - path: /botapi(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: bot-service
                port:
                  number: 80
          - path: /searchapi(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: search-service
                port:
                  number: 80
          - path: /moduleapi(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: module-service
                port:
                  number: 80
          - path: /commandapi(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: command-service
                port:
                  number: 80
