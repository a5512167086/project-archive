apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-web-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-web
  template:
    metadata:
      labels:
        app: platform-web
    spec:
      containers:
        - name: platform-web
          image: a5512167086/easybot-platform-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: platform-web-service
spec:
  selector:
    app: platform-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
