apiVersion: apps/v1
kind: Deployment
metadata:
  name: command-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: command
  template:
    metadata:
      labels:
        app: command
    spec:
      containers:
        - name: command
          image: a5512167086/easybot-command-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80 
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: command-service
spec:
  selector:
    app: command
  ports:
    - protocol: TCP
      port: 80        
      targetPort: 80   