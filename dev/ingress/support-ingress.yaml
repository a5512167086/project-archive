apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: support-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - http:
        paths:
          - path: /userapi(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: user-service
                port:
                  number: 80
          - path: /botapi(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: bot-service
                port:
                  number: 80
          - path: /searchapi(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: search-service
                port:
                  number: 80
          - path: /moduleapi(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: module-service
                port:
                  number: 80
          - path: /commandapi(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: command-service
                port:
                  number: 80
          - path: /knowledgeapi(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: knowledge-service
                port:
                  number: 80
          - path: /liff(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: liff-web-service
                port:
                  number: 80
