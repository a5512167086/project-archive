apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bot
  template:
    metadata:
      labels:
        app: bot
    spec:
      containers:
        - name: bot
          image: a5512167086/easybot-bot-service:latest
          env:
            - name: DB_HOST
              value: "10.21.26.74"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "easybot"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              value: "0000"
            - name: JWT_SECRET
              value: "REDACTED_SECRET"
            - name: BASE_URL
              value: "https://demo.wke.csie.ncnu.edu.tw/easybot/botapi/"
            - name: "COMMAND_SERVICE_API_URL"
              value: "https://demo.wke.csie.ncnu.edu.tw/easybot/commandapi"
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: bot-service
spec:
  selector:
    app: bot
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
