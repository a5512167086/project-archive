apiVersion: apps/v1
kind: Deployment
metadata:
  name: module-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: module
  template:
    metadata:
      labels:
        app: module
    spec:
      containers:
        - name: module
          image: a5512167086/easybot-module-service:latest
          env:
            - name: DB_HOST
              value: "localhost"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "easybot"
            - name: DB_USER
              value: "shin"
            - name: DB_PASSWORD
              value: "REDACTED_DB_PASSWORD"
            - name: COMMAND_SERVICE_API_URL
              value: "http://dev.local.com/commandapi"
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: module-service
spec:
  selector:
    app: module
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
