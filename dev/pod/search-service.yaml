apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search
  template:
    metadata:
      labels:
        app: search
    spec:
      containers:
        - name: search
          image: a5512167086/easybot-search-service:latest
          env:
            - name: DB_HOST
              value: "10.21.26.74"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "easybot"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              value: "0000"
            - name: AZURE_VISION_ENDPOINT
              value: "https://easybot.cognitiveservices.azure.com/"
            - name: AZURE_VISION_KEY
              value: "REDACTED_AZURE_VISION_KEY"
            - name: SELENIUM_HUB_URL
              value: "http://10.21.26.74:4444/wd/hub"
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: search-service
spec:
  selector:
    app: search
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
