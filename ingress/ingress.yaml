apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: easybot
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - easybot.wke.csie.ncnu.edu.tw
      secretName: wke-tls
  rules:
    - host: easybot.wke.csie.ncnu.edu.tw
      http:
        paths:
          - path: /authapi
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 80
          - path: /userapi
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 80
          - path: /botapi
            pathType: Prefix
            backend:
              service:
                name: bot-service
                port:
                  number: 80
          - path: /searchapi
            pathType: Prefix
            backend:
              service:
                name: search-service
                port:
                  number: 80
          - path: /moduleapi
            pathType: Prefix
            backend:
              service:
                name: module-service
                port:
                  number: 80
          - path: /commandapi
            pathType: Prefix
            backend:
              service:
                name: command-service
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-ingress
  namespace: easybot
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - easybot.wke.csie.ncnu.edu.tw
      secretName: wke-tls
  rules:
    - host: easybot.wke.csie.ncnu.edu.tw
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: platform-web-service
                port:
                  number: 80
