apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: api-ingressroute
  namespace: easybot
spec:
  entryPoints:
    - websecure
  routes:
    - match: PathPrefix(`/authapi`)
      kind: Rule
      services:
        - name: auth-service
          port: 80
    - match: PathPrefix(`/`)
      kind: Rule
      services:
        - name: auth-service
          port: 80
  tls:
    certResolver: letsencryptProd
