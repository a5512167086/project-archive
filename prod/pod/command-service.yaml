apiVersion: apps/v1
kind: Deployment
metadata:
  name: command-deployment
  namespace: easybot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: command
  template:
    metadata:
      labels:
        app: command
    spec:
      containers:
        - name: command
          image: a5512167086/easybot-command-service:latest
          env:
            - name: DB_HOST
              value: "10.21.26.74"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "easybot"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              value: "0000"
            - name: MODULE_SERVICE_API_URL
              value: "https://easybot.wke.csie.ncnu.edu.tw/moduleapi"
            - name: SEARCH_SERVICE_API_KEY
              value: "https://easybot.wke.csie.ncnu.edu.tw/searchapi"
          ports:
            - containerPort: 80 
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: command-service
  namespace: easybot
spec:
  selector:
    app: command
  ports:
    - protocol: TCP
      port: 80        
      targetPort: 80   