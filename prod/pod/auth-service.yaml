apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
  namespace: easybot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: a5512167086/easybot-auth-service:latest
          env:
            - name: JWT_SECRET
              value: "REDACTED_SECRET" 
            - name: JWT_ALGORITHM
              value: "HS256"
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: easybot
spec:
  selector:
    app: auth
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80