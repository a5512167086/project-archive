apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ingressroute
  namespace: easybot
spec:
  tls:
    certResolver: letsencryptProd
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`easybot.wke.csie.ncnu.edu.tw`)
      services:
        - name: platform-web-service
          port: 80
    - kind: Rule
      match: Host(`easybot.wke.csie.ncnu.edu.tw`) && PathPrefix(`/authapi`)
      services:
        - name: auth-service
          port: 80
    - kind: Rule
      match: Host(`easybot.wke.csie.ncnu.edu.tw`) && PathPrefix(`/userapi/user/me`)
      middlewares:
        - name: auth-middleware
      services:
        - name: user-service
          port: 80
    - kind: Rule
      match: Host(`easybot.wke.csie.ncnu.edu.tw`) && PathPrefix(`/userapi`)
      services:
        - name: user-service
          port: 80
    - kind: Rule
      match: Host(`easybot.wke.csie.ncnu.edu.tw`) && PathPrefix(`/botapi`)
      services:
        - name: bot-service
          port: 80
    - kind: Rule
      match: Host(`easybot.wke.csie.ncnu.edu.tw`) && PathPrefix(`/searchapi`)
      services:
        - name: search-service
          port: 80
    - kind: Rule
      match: Host(`easybot.wke.csie.ncnu.edu.tw`) && PathPrefix(`/moduleapi`)
      services:
        - name: module-service
          port: 80
    - kind: Rule
      match: Host(`easybot.wke.csie.ncnu.edu.tw`) && PathPrefix(`/commandapi`)
      services:
        - name: command-service
          port: 80